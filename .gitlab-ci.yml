image: hub.lumigame.com/pentagon-base/live-page-automation-test-base:latest

variables:
  TEST_ENV: "PRO_SG"
  GAME_ID: "0"

stages:
  - test

.run_test: &run_test |
  if [ "$GAME_ID" = "0" ]; then
    for game in 80 71 22 55 10 3 2; do
      echo "Running tests for game $game"
      npm run test:LivePage -- --env=$TEST_ENV --gameid=$game
      npm run report:upload
      rm -rf allure-results/*
      echo "Contents of allure-results after cleanup:"
      ls -la allure-results/
    done
  else
    npm run test:LivePage -- --env=$TEST_ENV --gameid=$GAME_ID
    npm run report:upload
  fi

scheduled-test-job:
  stage: test
  script:
    - npm ci
    - *run_test
  artifacts:
    when: always
    paths:
      - allure-results/
      - playwright-report/
    expire_in: 7 days
